name: RFSAT build (RTK Postcard / ESP32)

# Builds the RFSAT fork of RTK Everywhere with the pinned ESP32 core and
# libraries (same Dockerfile as upstream, no SparkFun secrets needed) and
# uploads the firmware as a workflow artifact.

on:
  push:
    branches: [ "rfsat/**", "main" ]
    tags: [ "rfsat-v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. rfsat-v3.4-r1); leave empty for a plain build"
        required: false
        default: ""

env:
  CORE_VERSION: 3.0.7
  FIRMWARE_VERSION_MAJOR: 3
  FIRMWARE_VERSION_MINOR: 4


# The Release step creates GitHub releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Failover unit test (host)
        run: |
          cd Firmware/Tools
          g++ -std=c++17 -o /tmp/ft rfsat_failover_test.cpp && /tmp/ft

        # The name must contain "RTK_Everywhere_Firmware": SparkFun's RTK Firmware Uploader picks the
        # matching ESP32 bootloader by the file name, and otherwise writes the old RTK Surveyor one.
      - name: Version tag
        run: echo "TAG=RTK_Everywhere_Firmware_RFSAT_v${FIRMWARE_VERSION_MAJOR}_${FIRMWARE_VERSION_MINOR}_$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build in Docker
        run: |
          cd Firmware
          docker build -t rfsat_rtk --target deployment \
            --build-arg CORE_VERSION=${CORE_VERSION} \
            --build-arg FIRMWARE_VERSION_MAJOR=${FIRMWARE_VERSION_MAJOR} \
            --build-arg FIRMWARE_VERSION_MINOR=${FIRMWARE_VERSION_MINOR} \
            --build-arg ENABLE_DEVELOPER=true \
            --build-arg DEBUG_LEVEL=error \
            .
          docker create --name=rfsat rfsat_rtk:latest
          mkdir -p build
          docker cp rfsat:/RTK_Everywhere/build/esp32.esp32.esp32/. ./build/
          docker rm rfsat
          ls -la build

      # File names end with the RFSAT variant ID (_V4 = RTK Postcard + Portability Shield; master
      # documentation C-12). "RTK_Everywhere_Firmware" stays at the start for the uploader.
      - name: Rename
        run: |
          cd Firmware/build
          mv RTK_Everywhere.ino.bin ${TAG}_V4.bin
          mv RTK_Everywhere.ino.elf ${TAG}_V4.elf
          [ -f RTK_Everywhere.ino.merged.bin ] && mv RTK_Everywhere.ino.merged.bin ${TAG}_merged_V4.bin || true
          mv RTK_Everywhere.ino.bootloader.bin RTK_Everywhere_bootloader_V4.bin
          mv RTK_Everywhere.ino.partitions.bin RTK_Everywhere_partitions_V4.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            Firmware/build/${{ env.TAG }}*.bin
            Firmware/build/${{ env.TAG }}_V4.elf
            Firmware/build/RTK_Everywhere_*_V4.bin

      # Tags rfsat-v<upstream major>.<minor>-r<n> (e.g. rfsat-v3.4-r1) publish a GitHub pre-release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/rfsat-v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            Firmware/build/${{ env.TAG }}*.bin
            Firmware/build/RTK_Everywhere_*_V4.bin
